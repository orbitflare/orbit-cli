# OrbitFlare Jetstream — Full Config Reference
# Usage: orbitflare jet --config examples/jet-stream.yml
# Jetstream streams transactions only. For account updates use `orbitflare grpc` (Yellowstone).

transactions:
  pumpfun:
    account_required:
      - "6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P"
    account_include: []
    account_exclude: []
    # Fee payer, compute budget, program IDs, size and resolved lookup tables.
    # Applies to the whole subscription once any filter sets it (or pass --enrichment).
    include_enrichment: true

  jupiter-swaps:
    account_include:
      - "JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4"
    account_exclude: []
    account_required: []

  raydium-amm:
    account_required:
      - "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8"
    account_include: []
    account_exclude: []

  raydium-cpmm:
    account_required:
      - "CPMMoo8L3F4NbTegBCKVNunggL7H1ZpdTHKxQB5qKP1C"
    account_include: []
    account_exclude: []

  orca-whirlpool:
    account_required:
      - "whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc"
    account_include: []
    account_exclude: []

  my-wallet:
    account_include:
      - "Dv5tkHtFPHbQWncFqHB7Hdi3TJfgKE3W2vFhqspBVJPP"
    account_exclude:
      - "Vote111111111111111111111111111111111111111"
    account_required: []

  defi-broad:
    account_include:
      - "JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4"
      - "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8"
      - "CPMMoo8L3F4NbTegBCKVNunggL7H1ZpdTHKxQB5qKP1C"
      - "whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc"
      - "6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P"
    account_exclude:
      - "Vote111111111111111111111111111111111111111"
    account_required: []

timeout_secs: 30
tcp_keepalive_secs: 60

reconnect:
  initial_delay_ms: 100
  max_delay_ms: 30000
  multiplier: 2.0
  max_retries: 0
