[package]
name = "orbitflare"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Developer CLI for OrbitFlare - real-time gRPC streaming, RPC queries, project scaffolding and account management"
authors = ["OrbitFlare"]
license = "MIT"
repository = "https://github.com/orbitflare/orbit-cli"
homepage = "https://orbitflare.com"
readme = "README.md"
keywords = ["solana", "grpc", "rpc", "cli", "orbitflare"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "orbitflare"
path = "src/main.rs"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
colored = "3.1.1"
dirs = "6.0.0"
open = "5.3.3"
rand = "0.10.0"
rpassword = "7.4.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "time", "macros", "sync", "io-util", "net", "process", "signal"] }
toml = "1.0.6"

reqwest = { version = "0.13.2", features = ["json"] }
serde_json = "1.0.149"

tonic = "0.14.5"
prost = "0.14.3"
prost-types = "0.14.3"
tonic-prost = "0.14.5"
tokio-stream = "0.1.18"

serde_yml = "0.0.12"
shellexpand = "3.1.2"

bs58 = "0.5.1"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }

comfy-table = "7.2.2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"] }

[build-dependencies]
tonic-prost-build = "0.14.5"
