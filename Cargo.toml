[package]
name = "orbitflare"
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
description = "Developer CLI for OrbitFlare - real-time gRPC streaming, RPC queries, project scaffolding and account management"
authors = ["OrbitFlare"]
license = "MIT"
repository = "https://github.com/orbitflare/orbit-cli"
homepage = "https://orbitflare.com"
readme = "README.md"
keywords = ["solana", "grpc", "rpc", "cli", "orbitflare"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "orbitflare"
path = "src/main.rs"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
colored = "3.1.1"
dirs = "7.0.0"
open = "5.3.3"
rpassword = "7.4.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "time", "macros", "sync", "io-util", "net", "process", "signal"] }
toml = "1.0.6"

reqwest = { version = "0.13.2", features = ["json"] }
serde_json = "1.0.149"

orbitflare-sdk = { version = "0.4.0", features = ["all"] }
orbitflare-apex = { version = "0.1.2", features = ["rpc"] }
solana-system-interface = { version = "3.2", features = ["bincode"] }
wincode = "0.5"
tonic = "0.14.5"
tokio-stream = "0.1.18"

serde_norway = "0.9.42"
shellexpand = "3.1.2"

base64 = "0.23"
bs58 = "0.5.1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }

comfy-table = "7.2.2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"] }
